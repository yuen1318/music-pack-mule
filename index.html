<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf0f6" />
  <title>Music Pack Mule</title>
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/baloo2-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="header__title">Music Pack Mule</h1>
      <p class="header__subtitle">Tap a card to play. Tap again to pause.</p>
    </header>

    <main id="app" class="main"></main>

    <footer class="footer">
      <p>Hosted on GitHub Pages</p>
    </footer>
  </div>

  <div class="update-banner" id="updateBanner">✨ A new version is available — tap here to refresh</div>

  <script src="sounds.js" defer></script>
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data?.type === 'UPDATE_AVAILABLE') {
          const banner = document.getElementById('updateBanner');
          if (banner) {
            banner.classList.add('visible');
            banner.onclick = () => {
              window.location.reload();
            };
          }
        }
      });
    }
  </script>
</body>
</html>
